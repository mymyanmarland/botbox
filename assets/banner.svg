<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380">
<style>
  .float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .float2{animation:float 7.5s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:center}
  .tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .rise{animation:rise .9s cubic-bezier(.2,.9,.3,1) both}
  .glow{animation:glow 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.1)}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes glow{0%,100%{opacity:.22}50%{opacity:.4}}
</style>
<defs>
  <radialGradient id="rg1" cx="18%" cy="28%" r="55%">
    <stop offset="0%" stop-color="#e11d2e" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#e11d2e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg2" cx="85%" cy="75%" r="55%">
    <stop offset="0%" stop-color="#a21caf" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#a21caf" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ff8fa0"/>
  </linearGradient>
  <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff5c6c"/>
    <stop offset="100%" stop-color="#c11124"/>
  </linearGradient>
</defs>
<rect width="1200" height="380" fill="#08080d"/>
<rect width="1200" height="380" fill="url(#rg1)"/>
<rect width="1200" height="380" fill="url(#rg2)"/>
<g fill="#ffffff">
  <path class="tw" d="M80 60 l2.2 5.6 5.6 2.2 -5.6 2.2 -2.2 5.6 -2.2 -5.6 -5.6 -2.2 5.6 -2.2 Z"/>
  <path class="tw" style="animation-delay:.8s" d="M340 44 l1.8 4.4 4.4 1.8 -4.4 1.8 -1.8 4.4 -1.8 -4.4 -4.4 -1.8 4.4 -1.8 Z"/>
  <path class="tw" style="animation-delay:1.6s" d="M640 70 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z"/>
  <path class="tw" style="animation-delay:.4s" d="M930 52 l1.8 4.4 4.4 1.8 -4.4 1.8 -1.8 4.4 -1.8 -4.4 -4.4 -1.8 4.4 -1.8 Z"/>
  <path class="tw" style="animation-delay:2.1s" d="M1120 96 l2.2 5.6 5.6 2.2 -5.6 2.2 -2.2 5.6 -2.2 -5.6 -5.6 -2.2 5.6 -2.2 Z"/>
  <path class="tw" style="animation-delay:1.2s" d="M500 320 l1.8 4.4 4.4 1.8 -4.4 1.8 -1.8 4.4 -1.8 -4.4 -4.4 -1.8 4.4 -1.8 Z"/>
  <path class="tw" style="animation-delay:2.6s" d="M180 320 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
</g>
<ellipse class="glow" cx="235" cy="195" rx="150" ry="130" fill="#e11d2e"/>
<g transform="translate(115,95) scale(3.75)"><g class="float">
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#lbg)"/>
  <ellipse cx="22" cy="12" rx="14" ry="7" fill="#ffffff" opacity="0.16"/>
