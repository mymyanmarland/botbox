<text x="474" y="232" font-family="'Segoe UI',system-ui,sans-serif" font-size="31" fill="#c9c9d4" class="rise" style="animation-delay:.15s">Your own AI Telegram Bot in 5 minutes</text>
<text x="474" y="272" font-family="'Segoe UI',system-ui,sans-serif" font-size="24" fill="#71717a" class="rise" style="animation-delay:.3s">ကုဒ်မရေးတတ်လည်းရတယ် — No code needed</text>
<text class="float" x="1062" y="150" font-size="58" text-anchor="middle">💬</text>
<text class="float2" x="1120" y="250" font-size="46" text-anchor="middle">⚡</text>
<text class="float" style="animation-delay:1.2s" x="1010" y="320" font-size="42" text-anchor="middle">🖼️</text>
</svg>
