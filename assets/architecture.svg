<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380">
<style>
  .flow{stroke-dasharray:10 8;animation:dash 1.1s linear infinite}
  .flow2{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
  .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes dash{to{stroke-dashoffset:-18}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  text{font-family:'Segoe UI',system-ui,sans-serif}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#e11d2e"/>
  </marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#71717a"/>
  </marker>
</defs>
<rect width="960" height="380" rx="20" fill="#08080d"/>
<rect width="960" height="380" rx="20" fill="none" stroke="rgba(255,255,255,.09)"/>
<text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#fafafa">How BotBox works</text>

<!-- nodes -->
<g>
  <rect x="60" y="120" width="150" height="92" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
  <text x="135" y="162" text-anchor="middle" font-size="34">👤</text>
  <text x="135" y="196" text-anchor="middle" font-size="15" fill="#d4d4d8">User</text>
</g>
<g>
  <rect x="270" y="120" width="150" height="92" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
  <text x="345" y="162" text-anchor="middle" font-size="34">✈️</text>
  <text x="345" y="196" text-anchor="middle" font-size="15" fill="#d4d4d8">Telegram</text>
</g>
<g>
  <rect class="pulse" x="480" y="120" width="150" height="92" rx="16" fill="rgba(225,29,46,.10)" stroke="#e11d2e" stroke-width="2"/>
  <text x="555" y="162" text-anchor="middle" font-size="34">🤖</text>
  <text x="555" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#fda4af">BotBox Engine</text>
</g>
<g>
  <rect x="690" y="120" width="210" height="92" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
  <text x="795" y="162" text-anchor="middle" font-size="34">🔑</text>
  <text x="795" y="196" text-anchor="middle" font-size="15" fill="#d4d4d8">Relay API (BYO key)</text>
</g>

<!-- flows -->
<line class="flow" x1="210" y1="166" x2="262" y2="166" stroke="#e11d2e" stroke-width="3" marker-end="url(#arr)"/>
<text x="236" y="150" text-anchor="middle" font-size="12" fill="#a1a1aa">message</text>
<line class="flow" x1="420" y1="166" x2="472" y2="166" stroke="#e11d2e" stroke-width="3" marker-end="url(#arr)"/>
<text x="446" y="150" text-anchor="middle" font-size="12" fill="#a1a1aa">polling</text>
<line class="flow" x1="630" y1="166" x2="682" y2="166" stroke="#e11d2e" stroke-width="3" marker-end="url(#arr)"/>
<text x="656" y="150" text-anchor="middle" font-size="12" fill="#a1a1aa">prompt</text>
<line class="flow" x1="682" y1="186" x2="630" y2="186" stroke="#e11d2e" stroke-width="3" marker-end="url(#arr)" opacity=".7"/>
<text x="656" y="208" text-anchor="middle" font-size="12" fill="#a1a1aa">AI reply</text>

<!-- memory -->
<g>
  <rect x="480" y="258" width="150" height="76" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
  <text x="555" y="288" text-anchor="middle" font-size="26">💾</text>
  <text x="555" y="316" text-anchor="middle" font-size="13" fill="#a1a1aa">per-user memory</text>
</g>
<line class="flow2" x1="555" y1="212" x2="555" y2="250" stroke="#71717a" stroke-width="2.5" marker-end="url(#arrG)"/>
<line class="flow2" x1="575" y1="250" x2="575" y2="212" stroke="#71717a" stroke-width="2.5" marker-end="url(#arrG)" opacity=".6"/>

<!-- admin -->
<g>
  <rect x="690" y="258" width="210" height="76" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
  <text x="795" y="288" text-anchor="middle" font-size="26">🛡️</text>
  <text x="795" y="316" text-anchor="middle" font-size="13" fill="#a1a1aa">owner admin panel</text>
</g>
<line class="flow2" x1="700" y1="296" x2="648" y2="296" stroke="#71717a" stroke-width="2.5" marker-end="url(#arrG)"/>
<text x="600" y="290" text-anchor="middle" font-size="12" fill="#71717a">stats</text>

<!-- imagine note -->
<text x="480" y="366" text-anchor="middle" font-size="13" fill="#71717a">/imagine → image model → 🖼️ photo &nbsp;·&nbsp; /myid → 🆔 &nbsp;·&nbsp; allowlist 🔒 protects your API credit</text>
</svg>
