<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620">
<style>
  text{font-family:'Segoe UI','Noto Sans Myanmar',system-ui,sans-serif}
  .msg{opacity:0;animation:cyc 15s infinite both}
  @keyframes cyc{0%{opacity:0;transform:translateY(10px)}2.5%{opacity:1;transform:none}86%{opacity:1}92%,100%{opacity:0}}
  .tdot{opacity:0;animation:ty 15s infinite both;animation-delay:2.2s}
  @keyframes ty{0%,12%{opacity:0}14%,22%{opacity:1}24%,100%{opacity:0}}
  .bnc{animation:bnc 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bnc{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .shimmer{animation:shm 2.2s linear infinite}
  @keyframes shm{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
</style>
<defs>
  <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff5c6c"/><stop offset="100%" stop-color="#c11124"/>
  </linearGradient>
  <linearGradient id="imgg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f43f52"/><stop offset="55%" stop-color="#a21caf"/><stop offset="100%" stop-color="#1e1b4b"/>
  </linearGradient>
</defs>
<rect width="400" height="620" rx="24" fill="#0b0b12"/>
<rect width="400" height="620" rx="24" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2"/>
<!-- header -->
<rect width="400" height="66" rx="24" fill="rgba(255,255,255,.05)"/>
<rect y="42" width="400" height="24" fill="rgba(255,255,255,.05)"/>
<circle cx="42" cy="33" r="19" fill="url(#lbg)"/>
<text x="42" y="40" text-anchor="middle" font-size="20">🤖</text>
<text x="70" y="30" font-size="15" font-weight="700" fill="#fafafa">@my_shop_bot</text>
<circle cx="74" cy="46" r="4" fill="#34d399"/>
<text x="84" y="50" font-size="12" fill="#6ee7b7">online</text>

<!-- m1: user question -->
<g class="msg" style="animation-delay:.5s">
  <rect x="118" y="86" width="266" height="46" rx="15" fill="#e11d2e"/>
  <text x="370" y="115" text-anchor="end" font-size="15" fill="#fff">ဒီအင်္ကျီဈေးဘယ်လောက်?</text>
</g>
<!-- typing -->
<g class="tdot">
  <rect x="16" y="144" width="92" height="42" rx="14" fill="rgba(255,255,255,.08)"/>
  <circle class="bnc" cx="42" cy="165" r="6" fill="#fda4af"/>
  <circle class="bnc" style="animation-delay:.15s" cx="62" cy="165" r="6" fill="#fda4af"/>
  <circle class="bnc" style="animation-delay:.3s" cx="82" cy="165" r="6" fill="#fda4af"/>
</g>
<!-- m2: bot answer -->
<g class="msg" style="animation-delay:3.6s">
  <rect x="16" y="144" width="300" height="66" rx="15" fill="rgba(255,255,255,.08)"/>
  <text x="30" y="171" font-size="14" fill="#f4f4f5">၂၅,၀၀၀ ကျပ်ပါ!</text>
  <text x="30" y="195" font-size="14" fill="#f4f4f5">ဒီနေ့မှာရင် ပို့ခ free 🛍️</text>
</g>
<!-- m3: /imagine -->
<g class="msg" style="animation-delay:6s">
  <rect x="106" y="226" width="278" height="46" rx="15" fill="#e11d2e"/>
  <text x="370" y="255" text-anchor="end" font-size="15" fill="#fff">/imagine sunset over Bagan</text>
</g>
<!-- m4: generating -->
<g class="msg" style="animation-delay:7.8s">
  <rect x="16" y="288" width="252" height="44" rx="14" fill="rgba(255,255,255,.08)"/>
  <text class="shimmer" x="30" y="316" font-size="14" fill="#fda4af">🎨 ပုံထုတ်နေပါတယ်...</text>
</g>
<!-- generated image -->
<g class="msg" style="animation-delay:9.6s">
  <rect x="16" y="348" width="210" height="150" rx="14" fill="url(#imgg)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
  <text x="121" y="435" text-anchor="middle" font-size="52">🖼️</text>
  <rect x="16" y="510" width="252" height="40" rx="13" fill="rgba(255,255,255,.08)"/>
  <text x="30" y="536" font-size="13" fill="#a1a1aa">✨ လှလိုက်တာ!</text>
</g>
<!-- loop hint -->
<text x="200" y="600" text-anchor="middle" font-size="12" fill="#52525b">↻ live demo — loops</text>
</svg>
